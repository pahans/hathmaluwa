name: Poll unsupported blogs

on:
  schedule:
    # Every 30 minutes, offset from :00/:30. GitHub queues scheduled runs at
    # those exact marks alongside everyone else's crons, which can delay
    # delivery by hours; an off-beat minute clears the queue much faster.
    # Only covers blogs whose feed has no WebSub hub (subscriptionStatus
    # 'unsupported'); hub-backed blogs get pushed via the callback route
    # instead and are untouched by this job.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Poll blogs without WebSub support
        run: pnpm poll-unsupported-blogs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
