name: Renew WebSub subscriptions

on:
  schedule:
    # Every 6 hours. Renewal window in scripts/renew-subscriptions.ts should be
    # wide enough (24-48h before lease expiry) to tolerate GitHub's best-effort
    # cron delivery delays.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Renew expiring WebSub subscriptions
        run: pnpm websub:renew
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
